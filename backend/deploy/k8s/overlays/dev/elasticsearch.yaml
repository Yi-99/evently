# Dev-only single-node Elasticsearch, security off, 1 GB heap.
#
# Production: do NOT run this StatefulSet. Use either
#   * Elastic Cloud (hosted): set ELASTICSEARCH_URL to the deployment's endpoint and
#     ELASTICSEARCH_API_KEY to an API key with index privileges on `evently-*`; or
#   * ECK (Elastic Cloud on Kubernetes): install the operator
#     (`helm install elastic-operator elastic/eck-operator -n elastic-system --create-namespace`),
#     create an `Elasticsearch` resource with 3 nodes + TLS, and point ELASTICSEARCH_URL at
#     https://<name>-es-http.<ns>.svc:9200 with an API key (the client verifies the ECK CA; mount it
#     or use the cluster's trusted CA).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: evently-elasticsearch
  labels:
    app.kubernetes.io/name: evently-elasticsearch
    app.kubernetes.io/component: search
    dash0.com/enable: "false"
spec:
  serviceName: evently-elasticsearch
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: evently-elasticsearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evently-elasticsearch
        app.kubernetes.io/component: search
    spec:
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # ES refuses to start with the default vm.max_map_count on most nodes. Dev only; in prod use
        # a node tuning DaemonSet or ECK, which handles this.
        - name: sysctl
          image: busybox:1.36
          command: ["sh", "-c", "sysctl -w vm.max_map_count=262144 || true"]
          securityContext:
            privileged: true
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:9.1.0
          env:
            - name: discovery.type
              value: single-node
            - name: xpack.security.enabled
              value: "false"
            - name: xpack.security.http.ssl.enabled
              value: "false"
            - name: ES_JAVA_OPTS
              value: "-Xms1g -Xmx1g"
            - name: cluster.routing.allocation.disk.threshold_enabled
              value: "false"
          ports:
            - name: http
              containerPort: 9200
          resources:
            requests:
              cpu: 250m
              memory: 1536Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /_cluster/health?wait_for_status=yellow&timeout=5s
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 8
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: evently-elasticsearch
  labels:
    app.kubernetes.io/name: evently-elasticsearch
    app.kubernetes.io/component: search
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: evently-elasticsearch
  ports:
    - name: http
      port: 9200
      targetPort: http
