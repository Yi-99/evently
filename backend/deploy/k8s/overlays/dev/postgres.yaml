# Dev-only Postgres. Production uses a managed database via DATABASE_URL (see overlays/prod).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: evently-postgres
  labels:
    app.kubernetes.io/name: evently-postgres
    app.kubernetes.io/component: database
    dash0.com/enable: "false"
spec:
  serviceName: evently-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: evently-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evently-postgres
        app.kubernetes.io/component: database
    spec:
      securityContext:
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: evently-postgres
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: evently-postgres
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: evently-postgres
                  key: POSTGRES_DB
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: evently-postgres
  labels:
    app.kubernetes.io/name: evently-postgres
    app.kubernetes.io/component: database
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: evently-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
# Dev credentials only; matches DATABASE_URL in the dev ConfigMap patch.
apiVersion: v1
kind: Secret
metadata:
  name: evently-postgres
  labels:
    app.kubernetes.io/name: evently-postgres
    app.kubernetes.io/component: database
type: Opaque
stringData:
  POSTGRES_USER: evently
  POSTGRES_PASSWORD: evently-dev-password
  POSTGRES_DB: evently
