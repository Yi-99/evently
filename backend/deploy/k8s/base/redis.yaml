# Redis backs the EventBus (pub/sub + per-topic replay log). It is a cache, not a store: the
# replay log has a 24 h TTL and the API recreates state from Postgres, so no persistence is needed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: evently-redis
  labels:
    app.kubernetes.io/name: evently-redis
    app.kubernetes.io/component: event-bus
    dash0.com/enable: "false" # nothing to instrument; keep the operator's hands off this workload
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: evently-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evently-redis
        app.kubernetes.io/component: event-bus
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7-alpine
          args:
            - redis-server
            - --save
            - ""
            - --appendonly
            - "no"
            - --maxmemory
            - 256mb
            - --maxmemory-policy
            - allkeys-lru
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 320Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: evently-redis
  labels:
    app.kubernetes.io/name: evently-redis
    app.kubernetes.io/component: event-bus
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: evently-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
