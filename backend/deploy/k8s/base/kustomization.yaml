apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: evently

# Common labels (not used as selectors, so they can change without breaking Deployments).
# `app.kubernetes.io/part-of` groups the stack in Radar's topology view; `app` is kept because
# Radar's "group by app label" and many dashboards still look for the plain label.
labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      app.kubernetes.io/part-of: evently
      app.kubernetes.io/managed-by: kustomize
      app: evently

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - api-deployment.yaml
  - api-service.yaml
  - redis.yaml
  - ingress.yaml

images:
  - name: ghcr.io/OWNER/evently-api
    newTag: latest
