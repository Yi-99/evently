# TEMPLATE ONLY — placeholders, never real values. In a real cluster create this Secret out of band
# (External Secrets Operator, SOPS, `kubectl create secret generic evently-api-secrets --from-env-file=...`)
# and remove it from the kustomization, or keep it here and let your secret manager overwrite it.
#
# Every key is an app setting (app/core/config.py). Empty values mean "not configured".
apiVersion: v1
kind: Secret
metadata:
  name: evently-api-secrets
type: Opaque
stringData:
  SECRET_KEY: "REPLACE_ME_64_random_chars"
  # Prod: a managed Postgres (RDS, Cloud SQL, Neon…). Dev overlay patches this to the in-cluster StatefulSet.
  DATABASE_URL: "postgresql+asyncpg://USER:PASSWORD@HOST:5432/evently"
  ANTHROPIC_API_KEY: "REPLACE_ME"
  GOOGLE_MAPS_API_KEY: ""
  DEEPGRAM_API_KEY: ""
  ASSEMBLYAI_API_KEY: ""
  OPENAI_API_KEY: ""  # OpenAI STT and, with LLM_PROVIDER=openai or overrides, the OpenAI LLM
  LIVEKIT_URL: ""
  LIVEKIT_API_KEY: ""
  LIVEKIT_API_SECRET: ""
  RESEND_API_KEY: ""
  SMTP_HOST: ""
  SMTP_USERNAME: ""
  SMTP_PASSWORD: ""
  LUMA_API_KEY: ""
  ELASTICSEARCH_URL: ""
  ELASTICSEARCH_API_KEY: ""
  # Dash0: Organization settings → Auth tokens. Header format is fixed by the OTLP spec.
  OTEL_EXPORTER_OTLP_HEADERS: "Authorization=Bearer REPLACE_ME_DASH0_TOKEN"
