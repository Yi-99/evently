# SonarQube Cloud project settings (read by SonarSource/sonarqube-scan-action in .github/workflows/ci.yml).
# Replace the two placeholders with the values shown in SonarQube Cloud → Project → Information.
sonar.projectKey=ORG_evently
sonar.organization=ORG
sonar.projectName=Evently API
sonar.projectVersion=0.1.0

sonar.sources=app
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12,3.13

# Reports produced by the `test` and `lint` jobs (downloaded as artifacts before the scan).
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=pytest-report.xml
sonar.python.ruff.reportPaths=ruff-report.json

# Not source code (or not ours to grade). `sonar.exclusions` applies to main sources only;
# tests are declared via sonar.tests and analysed with test rules.
sonar.exclusions=docs/**,deploy/**,examples/**,**/__pycache__/**,.venv/**,.github/**
# No coverage expectation for tests themselves or for code that only runs against live services.
sonar.coverage.exclusions=tests/**,app/observability/otel.py,app/llm/anthropic_client.py
sonar.cpd.exclusions=tests/**

# Quality gate: fail the workflow when the gate fails (set to false to make Sonar advisory only).
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
